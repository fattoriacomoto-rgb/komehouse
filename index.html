<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>株式会社米ハウス｜ホームページ準備中</title>
<meta name="robots" content="noindex">
<style>
  :root { --ink:#2b2a26; --sub:#6b675e; --bg:#f7f4ec; --accent:#8a6d2f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    padding:2rem; text-align:center;
  }
  main { max-width:32rem; }
  .mark { font-size:2.6rem; letter-spacing:.3em; color:var(--accent); margin-bottom:1.2rem; }
  h1 { font-size:1.6rem; font-weight:600; letter-spacing:.15em; margin-bottom:.4rem; }
  .en { font-size:.8rem; letter-spacing:.35em; color:var(--sub); margin-bottom:2.4rem; }
  hr { width:3rem; border:none; border-top:1px solid var(--accent); margin:0 auto 2rem; }
  p { line-height:2; color:var(--sub); font-size:.95rem; }
  footer { margin-top:3rem; font-size:.75rem; color:var(--sub); letter-spacing:.1em; }
</style>
</head>
<body>
<main>
  <div class="mark">米</div>
  <h1>株式会社米ハウス</h1>
  <div class="en">KOMEHOUSE</div>
  <hr>
  <p>ただいまホームページを準備しています。<br>公開まで、いましばらくお待ちください。</p>
  <footer>&copy; 株式会社米ハウス</footer>
</main>
</body>
</html>
